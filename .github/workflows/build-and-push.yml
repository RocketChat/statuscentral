name: Build and Push

on:
  push:
    tags:
      - v*
    branches:
      - master

permissions: {}

jobs:
  build-and-push:
    name: Build And Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: OIDC token
        id: docker_oidc
        uses: docker/oidc-action@96ba694c64860c7209bcd1ede7d698c71564ef78 # v1.2.0
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_ID }}
      - name: Docker OIDC login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: rocketchat
          password: ${{ steps.docker_oidc.outputs.token }}
      - name: Build and push
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            rocketchat/statuscentral:${{ github.sha }}
